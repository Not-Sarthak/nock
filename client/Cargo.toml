[package]
name = "nock-client"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/Not-Sarthak/nock"
description = "rust client for the nock program, generated by codama from idl/nock.json"

# a separate workspace with its own lockfile: the client's solana crates must
# not move the program's test dependencies.
[workspace]

[lib]
path = "src/lib.rs"

[features]
# account fetch helpers over rpc.
fetch = ["dep:solana-rpc-client", "dep:solana-account"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "1.0"
solana-account-info = "~3.1"
solana-address = { version = "~2.2", features = ["borsh", "curve25519", "decode"] }
solana-cpi = "~3.1"
solana-instruction = "~3.2"
solana-program-error = "~3.0"
solana-account = { version = "~3.0", optional = true }
solana-rpc-client = { version = "3.0", optional = true }

[lints.rust]
# the generator also emits anchor interop behind these features; this crate
# does not offer it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor", "anchor-idl-build"))'] }
