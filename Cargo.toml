[workspace]
resolver = "2"
members = ["interface", "program", "tests"]
# the rust client is its own workspace (see client/Cargo.toml).
exclude = ["client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sarthak"]
license = "MIT"
repository = "https://github.com/Not-Sarthak/nock"
description = "per-maker on-chain order book exchange on solana"

[workspace.dependencies]
pinocchio                            = { version = "0.11", features = ["cpi"] }
pinocchio-system                     = "0.6"
pinocchio-token                      = "0.6"
pinocchio-associated-token-account   = "0.4"
solana-address                       = { version = "2.6", features = ["decode", "curve25519"] }

[profile.release]
overflow-checks  = true
lto              = "fat"
codegen-units    = 1
opt-level        = 3
strip            = true
panic            = "abort"
incremental      = false
debug-assertions = false
debug            = false

# agave release used by cargo build-sbf, ci and the verifiable build image.
[workspace.metadata.cli]
solana = "3.1.6"
